[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbench"
version = "0.2.0"
description = "Multi-provider AI Model Benchmark Suite"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.43.0",
    "claude-agent-sdk>=0.1.0",
    "rich>=13.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
google = ["google-genai>=1.0"]
all-providers = ["openai>=1.0", "google-genai>=1.0"]

[project.scripts]
cbench = "cbench.cli:main"

[tool.setuptools.packages.find]
include = ["cbench*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["E501", "ANN401"]  # E501: line length handled by formatter; ANN401: allow Any

[tool.ruff.lint.per-file-ignores]
"cbench/repair/fixtures/**" = ["ANN", "B011", "RUF015", "SIM102"]

[tool.ruff.lint.isort]
known-first-party = ["cbench"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# Downgrade external-lib noise to warnings (strict still enforces our annotations)
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownParameterType = "warning"
reportMissingTypeStubs = "warning"
reportMissingImports = "warning"
reportAttributeAccessIssue = "warning"
reportPrivateUsage = "warning"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["cbench/repair/fixtures/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "openai.*",
    "google.*",
    "google.genai.*",
    "claude_agent_sdk.*",
    "rich.*",
    "matplotlib.*",
    "numpy.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "cbench.repair.fixtures.*",
    "cbench.repair.fixtures.*.*",
    "handler",
    "calculator",
    "pipeline",
]
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
